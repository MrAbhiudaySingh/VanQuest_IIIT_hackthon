<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANQUEST - Cozy Stall Store</title>
  <!-- Pure Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="stall-body">

  <!-- Ambient background scene: evening town street & shop environment -->
  <div class="ambient-backdrop"></div>
  <div class="ambient-vignette"></div>

  <!-- Main Storefront Stall Container -->
  <div class="stall-outer-wrapper">
    
    <!-- Left Sidewalk A-Frame Wooden Shop Sign -->
    <aside class="aframe-chalkboard" aria-label="Shop Board">
      <div class="chalkboard-face">
        <div class="chalk-cart-icon">
          <!-- Pixel Shopping Cart Icon -->
          <svg viewBox="0 0 16 16" width="32" height="32" class="pixel-svg">
            <path fill="#f6d289" d="M1 2h3l1.5 7h7.5l1.5-5H5V3h10l-2 7H5L3.5 3H1V2zm4 11a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
          </svg>
        </div>
        <div class="chalk-shop-text">SHOP</div>
        <div class="chalk-arrow">➔</div>
      </div>
      <div class="chalkboard-leg leg-left"></div>
      <div class="chalkboard-leg leg-right"></div>
    </aside>

    <!-- Main Wooden Market Stall Structure -->
    <main class="market-stall" id="marketStall" role="dialog" aria-labelledby="stallSignTitle">

      <!-- Hanging Ivy Vines / Foilage Corners -->
      <div class="ivy-cluster ivy-left"></div>
      <div class="ivy-cluster ivy-right"></div>

      <!-- Hanging Lanterns -->
      <div class="exterior-lantern lantern-left">
        <div class="lantern-bracket"></div>
        <div class="lantern-glass">
          <div class="lantern-flame"></div>
        </div>
      </div>
      <div class="exterior-lantern lantern-right">
        <div class="lantern-bracket"></div>
        <div class="lantern-glass">
          <div class="lantern-flame"></div>
        </div>
      </div>

      <!-- Red & White Striped Fabric Canopy / Awning -->
      <header class="stall-awning">
        <!-- Top Wooden Carved Nameplate Plaque -->
        <div class="awning-sign-plaque">
          <div class="sign-inner-bezel">
            <div class="sign-cart-badge">
              <svg viewBox="0 0 16 16" width="22" height="22" class="pixel-svg">
                <path fill="#fae8ca" d="M1 2h2.5l1.5 7h7.5l1.5-5H4.8V3h10l-2 7H5L3.5 3H1V2zm4 11a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
              </svg>
            </div>
            <div class="sign-title-group">
              <h1 class="stall-title" id="stallSignTitle">[STORE_NAME]</h1>
              <div class="stall-subtitle">
                <span class="sub-keeper">[KEEPER_NAME]</span>
                <span class="sub-sep">-</span>
                <span class="sub-role">[ROLE_OR_OCCUPATION]</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Scalloped Awning Stripes (Red & Cream) -->
        <div class="awning-stripes-row">
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
          <div class="awning-stripe stripe-red"></div>
          <div class="awning-stripe stripe-cream"></div>
        </div>
        <div class="awning-valance-fringe"></div>
      </header>

      <!-- Shopkeeper Dialogue Quote Strip & Close Button -->
      <section class="dialogue-banner-bar" aria-label="Shopkeeper Dialogue">
        <div class="dialogue-quote-box">
          <span class="dialogue-name" id="dialogueSpeaker">[KEEPER_NAME]:</span>
          <span class="dialogue-quote" id="dialogueText">"[SHOPKEEPER_DIALOGUE_OR_TIP_TEXT]"</span>
        </div>
        <button class="pixel-stall-close-btn" id="closeStoreBtn" title="Close Store" aria-label="Close Store">
          <span>✕</span>
        </button>
      </section>

      <!-- Timber Shelf Shelving Bay (3 Columns x 2 Rows) -->
      <section class="timber-shelves-bay" id="timberShelvesBay" aria-label="Store Shelves">
        <div class="shelves-grid" id="shelvesGrid">
          <!-- Populated with placeholder slots by store.js -->
        </div>
      </section>

      <!-- Bottom Carved Dark Wooden Counter / Checkout Footer -->
      <footer class="stall-counter-footer">
        <!-- Left: Leather Wallet & Balance -->
        <div class="wallet-badge">
          <div class="pixel-wallet-icon">
            <svg viewBox="0 0 16 16" width="26" height="26" class="pixel-svg">
              <rect x="2" y="3" width="12" height="10" fill="#9a5829" />
              <rect x="3" y="2" width="10" height="2" fill="#bc773c" />
              <rect x="2" y="12" width="12" height="2" fill="#5c2e10" />
              <rect x="9" y="6" width="5" height="4" fill="#693717" />
              <circle cx="11.5" cy="8" r="1" fill="#facc15" />
            </svg>
          </div>
          <span class="wallet-text-label">WALLET</span>
          <span class="wallet-symbol">₹</span>
          <span class="wallet-amount" id="walletAmount">12,001</span>
        </div>

        <!-- Right: Basket summary & Action Buttons -->
        <div class="counter-actions">
          <div class="basket-counter-display">
            <div class="pixel-basket-mini-icon">
              <svg viewBox="0 0 16 16" width="18" height="18" class="pixel-svg">
                <path fill="#facc15" d="M1 2h2.5l1.5 7h7.5l1.5-5H4.8V3h10l-2 7H5L3.5 3H1V2zm4 11a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
              </svg>
            </div>
            <span class="basket-label-tag">BASKET:</span>
            <span class="basket-currency">₹</span>
            <span class="basket-val" id="basketTotal">0</span>
            <span class="basket-count-paren" id="basketCountSummary">(0 ITEMS)</span>
          </div>

          <button class="pixel-btn-wood-clear" id="clearBasketBtn" title="Clear Basket">CLEAR</button>
          <button class="pixel-btn-wood-review" id="checkoutBtn">
            <span>REVIEW PURCHASE</span>
            <span class="btn-right-chevron">›</span>
          </button>
        </div>
      </footer>

      <!-- Toast Notification Box -->
      <div class="pixel-toast" id="pixelToast" aria-live="polite"></div>
    </main>

  </div>

  <script src="store.js"></script>
</body>
</html>
