<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VanQuest — Pixel Glass Navigation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--ink:#20262c;--cream:#f3edda;--red:#b83232;--blue:#4c657b;--green:#49765c;--gold:#c28d28;--teal:#376e68;--line:#30383d;--glass:rgba(22,34,43,.74)}
*{box-sizing:border-box;image-rendering:pixelated}body{margin:0;min-height:100vh;font-family:'VT323',monospace;font-size:22px;color:var(--cream);background:#243e43}
.world{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(135deg,#193e3fdd,#283c50d9),repeating-linear-gradient(0deg,#ffffff09 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,#ffffff09 0 2px,transparent 2px 32px),#315b4b}
.world:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 70%,#a6cf8540,transparent 26%),radial-gradient(circle at 78% 20%,#e7c16a25,transparent 25%);pointer-events:none}
.shell{position:relative;z-index:1;max-width:1240px;margin:auto;padding:18px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.8;text-shadow:2px 2px #111}.brand span{color:#ff817c}.chapter{font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.9;text-align:right;color:#e2eadc}
.navglass{display:flex;gap:5px;flex-wrap:wrap;padding:9px;background:rgba(13,24,34,.58);border:2px solid rgba(237,242,220,.55);box-shadow:4px 4px 0 #101c25aa,inset 0 1px #ffffff35;backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%)}
button{font-family:'Press Start 2P',monospace;cursor:pointer}
.navbtn{font-size:8px;line-height:1.8;min-height:48px;padding:8px 10px;display:flex;align-items:center;gap:7px;color:#fff9e9;border:2px solid rgba(255,255,255,.46);border-radius:0;background:rgba(66,86,103,.72);box-shadow:inset -3px -3px 0 #0003,inset 3px 3px 0 #ffffff22;transition:transform .08s,filter .08s,background .08s;backdrop-filter:blur(4px)}
.navbtn:hover{filter:brightness(1.16);transform:translate(-1px,-1px)}.navbtn:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 #0004}.navbtn:focus-visible{outline:2px dashed #ffe49a;outline-offset:2px}
.navbtn.time{background:rgba(74,91,105,.78)}.navbtn.skip{background:rgba(184,50,50,.82)}.navbtn.inventory{background:rgba(64,91,119,.8)}.navbtn.pantry{background:rgba(57,112,78,.82)}.navbtn.wardrobe{background:rgba(104,88,131,.82)}.navbtn.finance{background:rgba(145,99,34,.84)}.navbtn.history{background:rgba(44,104,97,.82)}.navbtn.retirement{background:rgba(57,102,91,.86);border-color:#9ad5b2}.navbtn.reset{background:rgba(42,48,52,.86);min-width:45px;justify-content:center}.ico{font-size:15px}.key{font-size:8px;color:#fff1c4;border:1px solid #ffffff7a;padding:2px 3px}
.main{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:15px}.card{background:rgba(246,241,220,.86);color:#252c30;border:3px solid #30383d;box-shadow:4px 4px 0 #0b151d77;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.head{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.8;padding:10px 12px;background:rgba(223,215,189,.77);border-bottom:3px solid #30383d}.body{padding:16px}.body h1{font-family:'Press Start 2P',monospace;font-size:16px;line-height:1.8;margin:0 0 12px}.body p{font-size:23px;line-height:1.3;margin:0;color:#505758}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.stat{padding:7px 9px;border:2px solid #363c3f;background:#f6f0db;color:#242b30}.stat b{color:var(--red)}.quest{display:flex;gap:9px;align-items:center;padding:11px;border-bottom:2px dashed #c7c0aa}.quest:last-child{border:0}.qicon{width:34px;height:34px;display:grid;place-items:center;border:2px solid #3c4244;background:#e2e6d6;font-size:19px}.quest strong{font-size:22px}.quest small{display:block;color:#606666;font-size:18px}
.toast{position:fixed;z-index:10;bottom:18px;left:50%;transform:translate(-50%,150%);max-width:92vw;padding:10px 15px;background:rgba(245,239,217,.94);color:#222a30;border:3px solid #30383d;box-shadow:4px 4px 0 #0005;font-size:21px;transition:transform .16s steps(4,end);backdrop-filter:blur(8px)}.toast.show{transform:translate(-50%,0)}
@media(max-width:760px){.shell{padding:9px}.brandrow{align-items:flex-start;flex-direction:column}.chapter{text-align:left}.main{grid-template-columns:1fr}.navbtn{flex:1 1 40%;justify-content:space-between}.brand{font-size:11px}}
</style></head><body><div class="world"><main class="shell"><header class="brandrow"><div><div class="brand">VAN<span>QUEST</span></div><div style="font-size:20px;color:#e3e9dc">A little pixel world. A lifetime of choices.</div></div><div class="chapter">LIFE SIMULATION<br>DAY 07 · SUMMER</div></header>
<nav class="navglass" aria-label="Game navigation">
<button class="navbtn time" data-name="Next day"><span class="ico">☼</span> NEXT DAY <span>▶</span></button>
<button class="navbtn time" data-name="To 1st"><span class="ico">»</span> TO 1ST <span>▶</span></button>
<button class="navbtn skip" data-name="Skip 1 year"><span class="ico">⌛</span> SKIP 1 YEAR</button>
<button class="navbtn inventory" data-name="Inventory"><span class="ico">▣</span> INVENTORY <span class="key">I</span></button>
<button class="navbtn pantry" data-name="Pantry"><span class="ico">▤</span> PANTRY <span class="key">P</span></button>
<button class="navbtn wardrobe" data-name="Wardrobe"><span class="ico">♙</span> WARDROBE <span class="key">C</span></button>
<button class="navbtn finance" data-name="Finances"><span class="ico">₹</span> FINANCES <span class="key">O</span></button>
<button class="navbtn history" data-name="History"><span class="ico">▤</span> HISTORY <span class="key">H</span></button>
<button class="navbtn retirement" data-name="Retirement"><span class="ico">⌂</span> RETIREMENT <span class="key">R</span></button>
<button class="navbtn reset" data-name="Reset simulation" aria-label="Reset simulation">↻</button>
</nav>
</main></div><div class="toast" id="toast" role="status"></div>
<script>const toast=document.getElementById('toast');let timer;document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{toast.textContent=b.dataset.name==='Reset simulation'?'Demo only: connect reset to your game.':b.dataset.name+' selected — connect this button to the game action.';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}));document.addEventListener('keydown',e=>{const m={i:'Inventory',p:'Pantry',c:'Wardrobe',o:'Finances',h:'History',r:'Retirement'};const n=m[e.key.toLowerCase()];if(n&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){const b=[...document.querySelectorAll('.navbtn')].find(x=>x.dataset.name===n);if(b)b.click()}});</script></body></html>
